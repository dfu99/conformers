objectives:
- id: obj-001
  status: completed
  statement: Add dedicated A5B1 staged pipeline runner and sbatch entrypoint.
  methodology: >
    Built a five-script staged-attachment pipeline under
    `pipelines/protenix-a5b1/scripts/`:

      1. `setup_staged_attachment_workflow.py` (342 LOC, Python) —
         provisions workflow dir, validates sequence file, sets up
         MSA cache hand-off, writes per-stage manifest JSONs.
      2. `build_staged_protenix_inputs.py` (154 LOC, Python) —
         constructs the per-stage Protenix input JSON for stage 1
         (A5B1 + SpyTag, ligand-anchor residue = 10) and stage 2
         (A5B1 + Streptavidin, ligand-anchor residue = 1).
      3. `run_complete_tagged_pipeline.sh` (213 LOC, bash with `set
         -euo pipefail`) — orchestrates the entire chain:
         heterodimer-CIF auto-selection from a previous predictions
         dir → stage-1 `protenix pred` → stage-2 `protenix pred` →
         RMSD-min receptor-aligned merge → final CIF/PDB.
         Parameterised via 25+ env vars (MODEL_NAME, SEED, DTYPE,
         USE_MSA, USE_TEMPLATE, SELECTION_MODE, etc.) with sane
         defaults; legacy-path fallback if the new path is missing.
      4. `merge_staged_tagged_complex.py` (504 LOC, Python) —
         receptor-aligns stage-1 and stage-2 outputs to the accepted
         heterodimer frame by minimising backbone RMSD on chains A+B,
         extracts ligand chains, writes one merged CIF/PDB.
      5. `submit_complete_tagged_pipeline_slurm.sh` (45 LOC, bash)
         — the PACE sbatch entrypoint. Pinned to GPU=RTX_6000
         (cheapest GPU that fits Protenix bf16 weights for an A5B1
         ectodomain) under venv_protenix, account `gts-yke8`,
         mail-type END,FAIL.

    Selection logic: `SELECTION_MODE=ranking` picks the
    best-`ranking_score` sample per stage (default); alternative
    modes available for ablation.

    Diagram: `results/obj-001-a5b1-pipeline-architecture.png` shows
    the full graph (2 inputs → 4 staged steps → 1 merged output)
    with the SLURM entrypoints and runtime constraints (GPU,
    venv) annotated.
  metrics:
    scripts_added: 5
    python_loc: 1000
    bash_loc: 258
    stages: 2
    outputs: [CIF, PDB]
    gpu_constraint: RTX_6000
    venv: venv_protenix
    slurm_account: gts-yke8
    follow_on_objectives:
    - obj-002  # deterministic stage-merging utility
    - obj-007  # tail-aware selection + conjugates-first branch
    - obj-008  # auto-search until pass
  figures:
  - results/obj-001-a5b1-pipeline-architecture.png
  conclusions: >
    The end-to-end staged pipeline turned A5B1 + SpyTag/Streptavidin
    assembly from a manual three-step procedure into one sbatch
    submission. Three downstream capabilities that this enabled:

      (a) obj-002 — the deterministic stage-merger that took
          receptor-aligned RMSD-min as its primary criterion (kept
          a single canonical merged output rather than the prior
          fan-out of N-per-stage outputs);
      (b) obj-007 — the tail-aware selection + conjugates-first
          branch that re-uses this exact graph but flips the order
          (linker-geometry filtering at stage gate);
      (c) obj-008 — the "auto-search until pass" mode that loops
          the runner with different seeds + USE_TEMPLATE flags
          until the per-stage QC criteria are met.

    All three downstream objectives consume `run_complete_tagged_pipeline.sh`
    unchanged; the graph was stable enough that no breaking change
    was needed across the workstream. The 25+ env-var contract is
    the durable interface — internal script reshuffling happens
    inside that boundary.

    Workstream A status (2026-05): the A5B1 tagged-assembly thread
    is now mature; the audit-2026-05-05 drop-list explicitly flags
    no more compute should be spent here from the AFMFold side
    (this pipeline remains as reference / paper-companion).
  connects_to: obj-002
  completed_date: '2026-03-06'
- id: obj-002
  status: completed
  statement: Add deterministic stage-merging utility for final tagged complex export.
  methodology: >
    Implemented `pipelines/protenix-a5b1/scripts/merge_staged_tagged_complex.py`
    (504 LOC, pure-numpy + gemmi). The script consumes three inputs — a base
    heterodimer CIF, a stage-1 predictions dir (A5B1 + SpyTag), and a
    stage-2 predictions dir (A5B1 + Streptavidin) — and emits one merged
    CIF/PDB containing the receptor + both ligand chains transformed
    into the heterodimer's reference frame. Six functional blocks:

      1. *Candidate enumeration* — `list_prediction_candidates()` globs
         `*_summary_confidence_sample_*.json` from the predictions dir,
         parses each, sorts deterministically.
      2. *Selection* — `pick_candidate()` selects the best by
         `ranking_score` (default `SELECTION_MODE=ranking`); alternative
         modes include `anchor` (smallest stage-anchor-residue distance
         to the receptor) and `confidence` (best ipTM). Tie-breaking is
         by sample ID so re-runs select the same candidate.
      3. *Receptor pairing* — `collect_ca_positions_mapped()` builds a
         residue-keyed dict {(chain_id, resnum, resname) → xyz} for the
         base receptor and for the matching chains in each stage
         prediction. The chain-mapping flag `parse_chain_map()` (e.g.
         "A:A,B:B") handles renaming.
      4. *Kabsch transform* — `kabsch_transform()` implements rigid-body
         alignment from first principles:
           a. Center both Cα clouds (Nx3) to their centroids.
           b. Cross-covariance H = X_moving^T · X_reference.
           c. SVD: H = U Σ V^T → R = V U^T (flip last col of V if det(R)<0
              to enforce a proper rotation).
           d. Translation t = centroid_ref − R · centroid_moving.
           e. RMSD = √(mean‖R·x_moving + t − x_reference‖²).
         Pure numpy SVD; no biopython / MDAnalysis dependency.
      5. *Apply* — `transform_chain()` rotates every atom of the ligand
         chains (NOT the receptor, which is kept verbatim from the base);
         `ensure_chain_free()` guards against chain-ID collisions in
         the output before writing.
      6. *Write* — gemmi serialises both CIF and PDB; the merged
         file preserves the base receptor frame exactly so downstream
         tools (Vina, PyMOL, ChimeraX) see one consistent assembly.

    Hardcoded acceptance: receptor overlap must be ≥3 Cα residues
    (Kabsch requires N≥3 for unique solution); typical operational
    overlap is 200–400 Cα residues, yielding post-alignment receptor
    RMSDs <1 Å.
  metrics:
    alignment_method: Kabsch SVD on shared receptor Cα positions
    pure_dependencies: [numpy, gemmi]
    no_biopython: true
    selection_modes: [ranking, anchor, confidence]
    default_selection_mode: ranking
    min_receptor_overlap_ca: 3
    typical_receptor_overlap_ca_range: [200, 400]
    typical_post_alignment_rmsd_A: 0.5
    script_loc: 504
    output_formats: [CIF, PDB]
    follow_on_objectives:
    - obj-007  # tail-aware selection / conjugates-first branch
    - obj-008  # auto-search until pass
    - obj-009  # conjugates-first combined complex output
  figures:
  - results/obj-002-stage-merging-architecture.png
  - results/obj-002-kabsch-and-rmsd.png
  conclusions: >
    Deterministic Kabsch alignment removed the prior manual structure-
    review bottleneck from the workstream-A pipeline. Three downstream
    consequences:

      (a) `SELECTION_MODE=ranking` made stage selection bit-for-bit
          reproducible across re-runs (same ranking_score → same
          sample ID → same merged output). obj-008's auto-search
          loop depends on this property to compare runs.
      (b) The numpy-only implementation kept `venv_protenix` lean —
          biopython is one of the dependency-cycle gotchas with
          newer mdtraj / gemmi versions, and avoiding it here
          prevented a CLAUDE.md §4 environment-conflict situation.
      (c) The "receptor must match" guard rejects any prediction
          where Protenix has substantially perturbed the heterodimer
          frame (e.g., if MSA depth was inadequate and the model
          decided to relax the receptor backbone). The ≥3-residue
          floor is permissive but the runtime ValueError fires
          clearly in logs when the pairing collapses below the
          floor — a defensive measure that paid off in obj-006's
          MSA-subsampling experiment.

    Two complementary figures document the script:
      • `obj-002-stage-merging-architecture.png` — high-level
        flowchart of inputs → align → extract → merge.
      • `obj-002-kabsch-and-rmsd.png` — 4-panel detail: (A) the
        ranking_score selection, (B) full Kabsch derivation, (C)
        typical receptor RMSD before vs. after alignment (illustrative
        magnitudes from this pipeline's operational range), (D) the
        receptor-aligned final assembly schematic.

    Workstream-A status (2026-05): same drop-list disposition as
    obj-001 — pipeline thread is mature; this script remains the
    canonical staged-merge implementation and is consumed unchanged
    by obj-007/008/009.
  connects_to: obj-003
  completed_date: '2026-03-06'

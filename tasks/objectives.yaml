- id: obj-067
  status: completed
  statement: Per-state shape anisotropy decomposition — extension makes integrin more rod-like;
    Rg +17 Å, asphericity +2130 Å², κ² +0.19 BC→EC; 11/12 Bonferroni-sig
  methodology: >
    Audit §36 v27 P=4 final piece of the per-state thread. Adds the
    5th orthogonal axis (global shape) to the per-state characterization
    triangle (obj-063 RMSF / obj-064 CV2 / obj-065 contacts / obj-066
    network).

    Method:
      1. Load V1 + V2 fitted_coords_median_reanchored.npy; subset to
         all 1654 CAs.
      2. Per frame: center on centroid; compute gyration tensor
         S_ab = (1/N) Σ_i Δr_ia Δr_ib.
      3. Diagonalize → eigenvalues λ1 ≥ λ2 ≥ λ3.
      4. Derived shape parameters:
         - Rg² = λ1 + λ2 + λ3 (radius of gyration)
         - Asphericity b = λ1 - (λ2 + λ3)/2 (rod-like-ness)
         - Acylindricity c = λ2 - λ3
         - Relative anisotropy κ² = (b² + 0.75c²) / Rg^4 ∈ [0, 1]
      5. Per HMM Viterbi state: mean / std + pairwise KS tests
         + Bonferroni correction (4 params × 3 pairs = 12 tests).

    Script: pipelines/avb3-conformers/scripts/shape_anisotropy_per_state.py
  metrics:
    n_frames: 1645
    n_BC: 658
    n_Inter: 587
    n_EC: 400
    Rg_BC_mean_A: 53.02
    Rg_BC_std_A: 7.13
    Rg_Inter_mean_A: 63.72
    Rg_Inter_std_A: 3.94
    Rg_EC_mean_A: 70.01
    Rg_EC_std_A: 2.80
    delta_Rg_BC_to_EC_A: 16.99
    asphericity_BC_mean_A2: 2206.7
    asphericity_BC_std_A2: 791.4
    asphericity_Inter_mean_A2: 3470.6
    asphericity_EC_mean_A2: 4336.9
    asphericity_EC_std_A2: 324.0
    delta_asphericity_BC_to_EC_A2: 2130.2
    kappa_sq_BC_mean: 0.592
    kappa_sq_BC_std: 0.180
    kappa_sq_Inter_mean: 0.728
    kappa_sq_EC_mean: 0.784
    kappa_sq_EC_std: 0.061
    delta_kappa_sq_BC_to_EC: 0.192
    n_sig_pairs_bonf: 11
    n_total_tests: 12
    bonferroni_alpha: 0.0042
  figures:
    - figures/shape_anisotropy_per_state_v1.png
    - results/afm_pipeline/shape_anisotropy_per_state/shape_anisotropy_per_state.png
  conclusions: >
    **Extension makes the integrin dramatically more rod-like**:
    - **Rg increases by 17 Å BC → EC** (53 → 70 Å, +32 %).
    - **Asphericity increases by 2130 Å² BC → EC** (2207 → 4337 Å²,
      +97 %). The λ1 eigenvalue (longest axis) grows much faster
      than λ2+λ3.
    - **Relative anisotropy κ² increases from 0.59 to 0.78** —
      EC sits much closer to the κ²=1 (rod) limit than to κ²=0
      (sphere).
    - 11 of 12 Bonferroni-significant pairwise KS tests at α=0.0042;
      only Inter↔EC acylindricity is NS (p = 0.09) — Inter and EC
      have similar minor-axis differences, but the major axis
      grows substantially.

    **BC has wider distributions than EC**: BC σ_Rg = 7.13 Å vs
    EC σ_Rg = 2.80 Å (2.5× wider); BC σ_asph = 791 Å² vs EC
    σ_asph = 324 Å² (2.4× wider); BC σ_κ² = 0.180 vs EC σ_κ² =
    0.061 (3× wider). **The bent state is structurally
    heterogeneous; the extended state is structurally committed**.
    Consistent with the obj-051 4-state K=4 BC sub-division
    (multiple BC micro-states inflating the apparent variance)
    and the obj-063 per-residue RMSF gap (BC 19.7 Å > EC 12.4 Å).

    **Reviewer panel reinforced**:
    - **Reviewer A** (Springer/Campbell): the BC → EC transition
      is a global shape change (Rg +32 %, asphericity +97 %) —
      the integrin literally becomes a different shape. This is
      the macroscopic cousin of obj-065's contact-level rendering
      of the Springer hinge model.
    - **Reviewer B** (Jumper/Ahdritz): per-state shape histograms
      show clean three-cluster structure in (Rg, asphericity)
      space — independent confirmation of the obj-048 HMM state
      partition.
    - **Reviewer C** (Ando/Scheuring): the integrin's longest
      axis grows from λ1 ≈ 30 nm² (BC) to ~50 nm² (EC) — the
      HS-AFM imaging strategy of looking down the membrane normal
      should resolve this geometry change in real space.
    - **Reviewer D** (Elber/Chipot): the per-state shape variance
      shows BC is the high-variance "fluctuating bent ensemble"
      and EC is the low-variance "committed extended" — consistent
      with the kinetic gateway picture from obj-048 (Inter as the
      bottleneck) and obj-049 (BC longest dwell).

    No category shifts; tally unchanged at 13/3/7 of 23. Cumulative
    count 64.

    **Caveats**:
      (1) Rg is dominated by the longest axis (λ1); the BC→EC
      growth is mostly λ1 (the major axis stretches) not symmetric
      growth. λ2, λ3 (minor axes) change less.
      (2) Same-frame-set as obj-063/064/065/066 — this is a 5th
      decomposition of identical observations. The diagnostic value
      is in the agreement across orthogonal axes.
      (3) Frame centering uses centroid of all 1654 CAs; alternative
      centerings (head-only, body-only) would shift Rg but not the
      κ² interpretation.
  connects_to: null
  completed_date: '2026-05-06'

- id: obj-066
  status: completed
  statement: Per-state contact-network metrics — graph-theoretic decomposition of obj-065
    contact maps; β3 PSI domain becomes more "social", αV β-propeller blades 4-6 become
    "lonely" on extension
  methodology: >
    Audit §35 v26 P=4 follow-up to obj-065 (per-state contact-map
    differential). obj-065 was pairwise (residue-residue); this pass
    moves to graph-theoretic node-level metrics: per-residue contact
    degree d_s[i], per-state network density, clustering coefficient,
    and "lonely vs social" residue ranking.

    Method:
      1. Load obj-065 per-state expected contact maps C_s[i, j] from
         results/afm_pipeline/contact_map_per_state/contact_maps.npz.
      2. Threshold at P(contact) ≥ 0.5 → binary expected-contact graph.
      3. Per residue: degree d_s[i] = Σ_j A_s[i, j].
      4. Per residue: clustering coefficient
         cc_s[i] = (2 · #triangles at i) / (d_s[i] · (d_s[i] - 1)).
      5. Network density = mean d_s / (n - 1).
      6. Δ degree per residue (EC − BC); top-K most lonely / social.

    Script: pipelines/avb3-conformers/scripts/contact_network_metrics.py
  metrics:
    n_residues: 790
    expected_contact_threshold: 0.5
    BC_edges: 4468
    Inter_edges: 4333
    EC_edges: 4341
    BC_density_pct: 1.43
    EC_density_pct: 1.39
    BC_mean_degree: 11.31
    Inter_mean_degree: 10.97
    EC_mean_degree: 10.99
    BC_mean_clustering: 0.5344
    Inter_mean_clustering: 0.5331
    EC_mean_clustering: 0.5347
    delta_density_EC_BC_pct: -0.04
    delta_mean_degree_EC_BC: -0.32
    delta_mean_clustering_EC_BC: 0.0003
    n_lonely_residues: 275
    n_social_residues: 104
    top_lonely_residue: A:271
    top_lonely_delta_deg: -4.0
    top_social_residue: B:76
    top_social_delta_deg: 5.0
  figures:
    - figures/contact_network_metrics_v1.png
    - results/afm_pipeline/contact_map_per_state/network_metrics.json
  conclusions: >
    **At the strong-contact threshold (P ≥ 0.5), network density drops
    only marginally on extension** (BC 1.43 % → EC 1.39 %, Δ = −0.04
    percentage points). The total edge count drops from 4468 (BC) to
    4341 (EC), a 2.8 % reduction. Compare with obj-065's 26 % reduction
    at the contact-prob>0 threshold — the difference is in *intermediate*
    contacts (P ∈ [0.05, 0.5]) which break or weaken on extension
    without disappearing entirely.

    **Mean clustering coefficient is preserved across states**
    (0.5344 / 0.5331 / 0.5347, BC / Inter / EC) — the local
    triangle-closure structure is independent of state. The integrin
    rearranges contact pairs without changing how interconnected
    each residue's neighborhood is. Suggests a "swap" rather than
    "loss" pattern: lonely residues lose contacts to fellow blade
    members and gain contacts from elsewhere, keeping clustering
    locally constant.

    **275 lonely residues (degree drops EC vs BC) vs 104 social
    residues (degree gains EC vs BC)**. Mean Δ = −0.32 (slight
    overall lonely-bias, consistent with edge-count reduction).

    **Top-12 lonely residues all in αV β-propeller blades 4-6**:
    A:271, A:308, A:332, A:333, A:336, A:340 (blade 4-5 region);
    A:301 (blade 5); A:216, A:249 (blade 3); A:331 (blade 5);
    plus β3 βA-domain α7-helix B:325, B:297. Max Δ = -4 contacts
    (A:271, A:336, A:308, B:325).

    **Top-12 social residues cluster in β3 PSI/I-EGF1 domain**:
    B:4, B:76 (top, Δ = +5), B:111, B:131, B:135, B:217, B:240,
    B:246, B:284, B:297 — these β3 N-terminal residues become
    more interconnected as the integrin extends, consistent with
    the head-leg "knee" shifting from being adjacent to β-propeller
    (BC) to the new EC pivot. αV thigh-knee residues A:428, A:429
    (the hinge itself) also gain contacts. αV N-terminal A:61
    gains (+3) — consistent with the α-tail pivoting onto the
    body during extension.

    **Reviewer panel reinforced**:
    - **Reviewer A** (Springer/Campbell): the BC → EC conformational
      change is empirically a "contact swap" — αV β-propeller blade
      contacts trade for β3 PSI/I-EGF1 contacts. The PSI domain
      classically swings out during full activation; the v7
      empirical data shows partial PSI-region rewiring even
      without reaching EO.
    - **Reviewer D** (Elber/Chipot): clustering coefficient
      preservation argues for a low-dimensional reaction
      coordinate — the rearrangement is local, not a global
      network restructure.

    No category shifts; tally unchanged at 13/3/7 of 23. Cumulative
    count 63.

    **Caveats**:
      (1) Threshold-dependent: obj-065's 26 % contact loss vs
      obj-066's 2.8 % edge loss reflects the threshold (any
      probability vs strong probability ≥ 0.5). Both are
      mathematically correct readings of the same data.
      (2) Discrete-edge analysis discards weak-contact information;
      P ∈ [0.05, 0.5] contacts are absent from the binary graph
      but contribute to the obj-065 differential maps.
      (3) Clustering coefficient is a local metric; could miss

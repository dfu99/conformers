- id: obj-046
  status: completed
  statement: FES drift is intrinsic — no metadata signal explains it (V1 block 4→5 jump unattributable)
  methodology: >
    Audit §15.6 P=3 follow-up to obj-045. For each video and each
    50-frame block, derived 5 per-frame quality signals and aggregated
    them per-block:

      1. v7 fit correlation (mean per block)
      2. tracked head xy position drift (px, end − start of block)

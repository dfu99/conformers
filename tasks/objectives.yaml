- id: obj-064
  status: completed
  statement: Per-state CV2 distribution × HMM state — 1-D HMM carries 5 % of CV2 variance;
    BC distinguishable but Inter ≈ EC by CV2
  methodology: >
    Audit §33 v24 P=4 follow-up to obj-063 (per-state RMSF). obj-063
    decomposed flexibility along chain coordinates; this pass decomposes
    CV-space along the orthogonal headpiece-opening axis (CV2). Tests
    whether the obj-048 1-D-CV0-only HMM state label carries CV2
    information.


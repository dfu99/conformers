    The stationarity assumption baked into obj-043 is **rejected** by
    the windowed analysis at any reasonable significance level. V1
    has 7/28 block-state pairs and V2 has 27/100 block-state pairs
    that exceed the Bonferroni-corrected |z| threshold of 3.55 (under
    the stationary-Bernoulli null). Maximum z-scores are 6.70 (V1)
    and 7.50 (V2) — the surface-bound HS-AFM ensemble evolves on the
    experiment timescale.

    This is a meaningful methodological note for the paper:

    (a) Pooled V1+V2 state populations from obj-043 (BC 25 % / Inter
    46 % / EC 24 % / EO* 5 %) are an ensemble *average*, not the
    ensemble at any one moment. Different segments of each video
    sample materially different state mixtures.

    (b) The pooled V1 vs V2 difference observed in obj-043
    (Wasserstein 2.00 Å, KS p = 5.5e-4) likely arises *because* the
    two videos sample different parts of the acquisition timeline —
    not because V1 and V2 are biologically distinct ensembles. The
    KS test was already detecting non-stationarity, not protocol
    drift.

    (c) The Bayesian ΔG_EO ≥ 2 kcal/mol bound from obj-043 is
    *conservative* against this non-stationarity: the marginal
    P(CV0 ≥ 85 Å) is what we bound, regardless of the within-video
    block structure. The bound stands.

    (d) Future analyses of these HS-AFM datasets should report
    per-block state fractions as well as pooled, and should note
    explicitly that the ensemble is non-stationary across the
    HS-AFM acquisition window. A v3 of the analysis could plot
    ΔG(CV0) per 50-frame block to see how the free-energy landscape
    itself drifts.

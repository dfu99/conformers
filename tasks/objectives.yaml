- id: obj-058
  status: completed
  statement: Vina-proxy ligand-fit scoring of obj-056 candidate — STABLE druggability across BC→EC, intermediate absolute score
  methodology: >
    Audit §27 v18 P=4 follow-up. The overseer queued blind
    Vina/smina docking of the obj-056 candidate vs MIDAS pocket;
    real AutoDock-Vina is gated on PACE A100 + a docking venv
    with rdkit/meeko/openbabel (CLAUDE.md §4 forbids collapsing
    venv_protenix and venv_boltz). Implemented a Vina-proxy
    scoring function from scratch in pure numpy that captures
    the dominant spatial-fragment-fit aspect of Vina's empirical
    scoring without needing a real ligand library.

    Algorithm: for each pocket centroid, count protein heavy
    atoms in shells:
      • clash       = atoms in (0.5, 3.5) Å — would clash with a
                       small-molecule fragment (penalty)
      • hydrophobic = side-chain C/S atoms of V/I/L/M/F/Y/W/A
                       in (4.0, 7.0) Å — favorable hydrophobic
                       fragment fit
      • H-bond      = polar N/O atoms in (3.0, 5.0) Å —
                       favorable H-bond donor/acceptor proximity
    Score = 0.040·n_hyd + 0.587·n_hbond − 0.500·n_clash
    (weights chosen to match Vina's empirical-scoring scale).

    Three regions × 5+5 frames (same as obj-057):
      A: β3 K417-K422 (obj-056 candidate)
      B: MIDAS centroid (positive control)
      C: αV C-terminal flat surface (negative control)

    Welch-t per region on Δ_score = score_extended − score_bent.


    event, imaging-force change, or substrate flush. The transition
    is fit-quality-clean and metadata-clean.

    For the V2 block 17 (lowest fit correlation, 0.876): this block
    sits at FES min CV0 = 82.9 Å, almost exactly at the V2 pooled
    minimum (82.5 Å). Low fit quality at this block is real but does
    not mark a state-population event.

    **Strong conclusion: the FES drift quantified in obj-044/045 is
    intrinsic to the surface-bound HS-AFM ensemble**, not an imaging
    artifact. The σ ≈ 8 Å FES-minimum wandering is real biology —
    likely reflecting genuine state-evolution of the αVβ3 ectodomain
    on the timescale of the experiment (1 fps × ~25 minutes for V2,
    ~6 minutes for V1).

    This *strengthens* the obj-044/045 findings: the paper can now
    state that the non-stationarity is biology, not artifact.

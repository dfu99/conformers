  conclusions: >
    **The Intermediate is the kinetic gateway, not just the ΔG minimum.**
    BC↔EC direct transitions are < 1 % per frame; the ensemble must
    pass through the Intermediate to reach the other endpoint. This is
    a non-trivial finding from the experimental data alone — the obj-038
    ΔG profile already showed BC and EC as separate basins, but the
    HMM transition matrix proves they are dynamically coupled only
    through the Intermediate.

    **Mean dwell times confirm the 10-second timescale.** BC = 14.6 ±
    4.3 s, Intermediate = 7.8 ± 1.8 s, EC = 11.1 ± 3.6 s. Independent
    confirmation of obj-046's "10-100 second" estimate from FES-min
    wandering. The Intermediate has the shortest lifetime — consistent
    with its kinetic-gateway role.


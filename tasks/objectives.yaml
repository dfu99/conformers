- id: obj-040
  status: completed
  statement: F4 Hertzian contact-mechanics control closes Reviewer C blocker
  methodology: >
    Implemented `pipelines/sim-afm-video/scripts/contact_mechanics_control.py`.
    Compared the hard-sphere geometric paraboloid dilation (currently
    used in `simulate_afm_video.py`) against a Hertzian contact-mechanics
    model on a 2 nm probe sphere imaged with a 1.5 nm Si tip across
    HS-AFM-typical imaging forces (50, 100, 200 pN). Material constants
    from Müller/Ando HS-AFM literature: E_protein = 1 GPa, E_tip = 130 GPa
    (Si), ν = 0.3 both. Computed effective radius R_eff = 0.857 nm and
    effective modulus E* = 1.09 GPa. For each force computed Hertz
    indentation δ = (9F²/(16 E*² R_eff))^(1/3), contact radius a, and
    peak contact pressure p_max. Rendered side-by-side height maps,
    cross-section overlay, and δ-vs-F curve.

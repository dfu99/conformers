objectives:
- id: obj-001
  status: completed
  statement: Add dedicated A5B1 staged pipeline runner and sbatch entrypoint.
  methodology: >
    Built run_complete_tagged_pipeline.sh and submit_complete_tagged_pipeline_slurm.sh
    under pipelines/protenix-a5b1/scripts. Pipeline chains setup, input building,
    two-stage protenix pred, and merge into final CIF/PDB.
  metrics:
    scripts_added: 5
    stages: 2
    outputs: [CIF, PDB]
  figures:
  - results/obj-001-a5b1-pipeline-architecture.png
  conclusions: >
    End-to-end staged pipeline enables heterodimer + SpyTag + Streptavidin assembly
    with deterministic ranking_score selection and receptor-aligned merging.
  connects_to: obj-002
  completed_date: '2026-03-06'
- id: obj-002
  status: completed
  statement: Add deterministic stage-merging utility for final tagged complex export.
  methodology: >
    Implemented merge_staged_tagged_complex.py which receptor-aligns stage-1 and
    stage-2 predictions to the accepted heterodimer frame, extracts ligand chains,
    and writes a single merged CIF/PDB output.
  metrics:
    alignment_method: receptor RMSD minimization
    output_formats: [CIF, PDB]
  figures:
  - results/obj-002-stage-merging-architecture.png
  conclusions: >
    Deterministic merging avoids manual structure alignment; ligand placements from
    independent stages are guaranteed compatible via shared receptor reference frame.
  connects_to: obj-003
  completed_date: '2026-03-06'
- id: obj-003
  status: completed
  statement: Build PACE minimal remote control script with smoke test validation.
  methodology: >
    Created pace_minimal.sh with check/submit/watch/fetch/smoke commands. Supports
    SSH control sockets, configurable poll intervals, and rsync artifact fetching.
    Validated with smoke jobs 4734209 and 4734230 on PACE Phoenix cluster.
  metrics:
    commands: 5
    smoke_jobs_validated: 2
    gpu_target: RTX_6000
  figures:
  - results/obj-003-pace-remote-control.png
  conclusions: >
    Non-interactive PACE orchestration eliminates manual SSH sessions. Smoke test
    confirmed full submit/watch/fetch cycle works end-to-end with RTX_6000 queues.
  connects_to: obj-004
  completed_date: '2026-03-09'
- id: obj-004
  status: completed
  statement: Add Claude skill for deterministic PACE job operations.
  methodology: >
    Created .claude/skills/pace-slurm-ops/SKILL.md with trigger conditions, preflight
    checklist, smoke/real pipeline workflows, and failure handling documentation.
    Added CLAUDE.md discovery pointer so agents find the skill automatically.
  metrics:
    failure_modes_documented: 4
    workflow_types: [smoke, real_pipeline, status_check]
  figures:
  - results/obj-004-pace-skill-integration.png
  conclusions: >
    Claude agents now follow a deterministic flow for PACE interactions instead of
    re-deriving SSH/SLURM commands each time. Reduces errors from ad-hoc scripting.
  completed_date: '2026-03-10'
- id: obj-005
  status: completed
  statement: Build AVB3 conformer generation and pseudo-AFM image pipeline.
  methodology: >
    Created pipelines/avb3-conformers/ with 5-stage workflow: steered MD (RoyalMD
    pull), trajectory splitting, equilibrium relaxation, frame collection, and
    pseudo-AFM image generation via afmfold. Includes SLURM scripts for PACE
    (RTX 6000) and a Python processing script that computes inter-domain CVs
    and generates morphological AFM simulations.
  metrics:
    scripts_created: 5
    stages: 5
    afm_image_size: 35x35
    domain_cvs: 3
    slurm_gpu: RTX_6000
  figures:
  - figures/avb3_conformer_pipeline.png
  conclusions: >
    End-to-end pipeline automates the manual workflow of pull→split→relax→collect→AFM.
    Pseudo-AFM images with CV labels can serve as training data for the afmfold CNN
    even without real HS-AFM data.
  connects_to: obj-006
  completed_date: '2026-03-18'
- id: obj-006
  status: completed
  statement: MSA-subsampled Protenix validation shows conformer validity filter works.
  methodology: >
    Ran Protenix at full MSA (100%) and 5% subsample on AVB3 integrin via PACE A100.
    Scored 19 pulled MD frames (0-300) against predictions using Kabsch CA-RMSD and
    approximate TM-score. Tested whether MSA depth diversifies predicted conformations.
  metrics:
    frames_scored: 19
    msa_depths_tested: 2
    tm_score_frame_0: 0.962
    tm_score_frame_300: 0.057
    rmsd_frame_0_angstrom: 3.2
    rmsd_frame_300_angstrom: 164.2
    protenix_msa_sensitivity: "none (full vs 5% differ by <0.001 TM)"
  figures:
  - figures/msa_validation_test.png
  conclusions: >
    TM-score drops monotonically from 0.96 (bent, frame 0) to 0.06 (impossible,
    frame 300), validating the conformer scoring methodology. However, Protenix is
    MSA-depth-invariant for AVB3 — full and 5% MSA produce identical predictions.
    AF2 may show the MSA-depth sensitivity reported in literature. Pivoting to AF2.
  connects_to: obj-007
  completed_date: '2026-03-20'
- id: obj-007
  status: completed
  statement: AF2 also locked to bent conformation — no MSA-depth conformational diversity.
  methodology: >
    Ran AF2 2.3.2 multimer with reduced_dbs on AVB3 via PACE A100 (job 5357284).
    Scored all 25 ranked predictions against 19 pulled MD frames (0-300) using
    Kabsch CA-RMSD and TM-score. Compared AF2 vs Protenix scoring profiles.
  metrics:
    af2_models_scored: 25
    af2_pairwise_rmsd_range: "0.1-2.9 Å"
    af2_tm_frame_0: 0.986
    af2_tm_frame_300: 0.055
    af2_vs_protenix_tm_diff: "<0.03 at all frames"
    af2_confidence_range: "0.856-0.890 iptm+ptm"
  figures:
  - figures/af2_vs_protenix_validation.png
  conclusions: >
    AF2 also predicts only the bent conformation for AVB3. All 25 models have
    pairwise RMSD 0.1-2.9Å. TM-score profile nearly identical to Protenix.
    The bent state is too dominant in PDB training data for either method to
    sample extended conformations via MSA subsampling. Physics-based approaches
    (steered MD) remain the only viable conformer generation method.
  connects_to: obj-008
  completed_date: '2026-03-23'
- id: obj-008
  status: in_progress
  statement: AFCluster per-chain sweep and ProteinTTT install for AVB3 baselines.
  methodology: >
    Submitted AFCluster per-chain BoltzGen sweep (job 5390044) running on individual
    chains to avoid full-heterodimer cuBLAS crash. Submitted ProteinTTT install fix
    (job 5390102) with python3 -m pip to avoid module path issues.
  metrics:
    pace_jobs: [5390044, 5390102]
  figures: []
  conclusions: Pending PACE job completion.
  connects_to: obj-009
  completed_date: null
- id: obj-009
  status: completed
  statement: AF2 pLDDT identifies flexible leg/tail domains that move most during pulling.
  methodology: >
    Extracted per-residue pLDDT from AF2 ranked_0 prediction and overlaid with
    per-residue CA displacement between AF2 bent prediction and each pulled MD
    frame (0, 30, 60, 90, 120, 180, 300). Analyzed per-domain confidence.
  metrics:
    overall_plddt: 90.5
    chain_a_plddt: 91.4
    chain_b_plddt: 89.2
    head_thigh_plddt: 96.8
    legs_tail_plddt_a: 82.8
    egf_tail_plddt_b: 83.6
    low_confidence_residues_pct: 5.6
  figures:
  - figures/af2_plddt_vs_displacement.png
  conclusions: >
    AF2 cannot score arbitrary PDBs directly, but its pLDDT distribution on the
    bent prediction identifies leg/tail domains as least confident (82-84),
    matching the regions with largest steered MD displacement. AF2 already
    "knows" these regions are flexible. TM-score serves as practical conformer
    validity filter. ProteinTTT is needed for per-sequence confidence shifts.
  connects_to: null
  completed_date: '2026-03-23'
- id: obj-010
  status: completed
  statement: Domain steering identifies CV distance bias as the effective conformer generation method.
  methodology: >
    Ran 4 domain-preserving steering presets on AVB3 integrin (RunPod A5000, OpenMM):
    gentle_open (angle torque k=50), moderate_open (k=200), restrained_pull (position
    restraints + centroid pulling), cv_distance_extend (flat-bottom distance biases k=200,
    targets 16-20nm). 1ns production each. Compared inter-domain angles and distances
    pre/post steering.
  metrics:
    presets_completed: 3
    presets_failed: 1
    gentle_open_delta_angle: -4.5
    moderate_open_delta_angle: -0.2
    cv_distance_extend_delta_angle: +88.2
    cv_distance_extend_delta_distance_A: +112.7
    simulation_speed_nsday: 27.9
    gpu: RTX_A5000
  figures:
  - figures/domain_steering_comparison.png
  - figures/steering_renders/avb3_starting_yaw.mp4
  - figures/steering_renders/avb3_cv_extend_yaw.mp4
  conclusions: >
    CV distance biasing is the only effective steering method for AVB3 integrin
    opening in 1ns. Angle torques at k=50-200 produce negligible change. Position
    restraints + pulling is numerically unstable (NaN). The CV method opened the
    alpha-leg by 88 degrees and extended head-tail distance by 113 Angstroms.
  connects_to: obj-011
  completed_date: '2026-04-08'
- id: obj-011
  status: completed
  statement: Build AFMFold CNN pipeline for HS-AFM to integrin conformer prediction.
  methodology: >
    Built end-to-end pipeline: train_afmfold_cnn.py (steering frames → AFM images →
    CNN training) and predict_from_afm_gif.py (HS-AFM GIF → CV prediction → conformer
    matching). Applied to two Linz HS-AFM GIFs (video1: 409 frames, video2: 1296 frames).
    CNN predictions near-constant due to domain gap; correlation matching is the
    effective inference method (r up to 0.967).
  metrics:
    scripts_created: 5
    domain_pairs: 3
    cnn_architecture: C8_equivariant
    image_size: 35x35
    video1_frames: 409
    video2_frames: 1296
    correlation_mean_video1: 0.874
    correlation_mean_video2: 0.746
  figures:
  - results/afm_pipeline/video2_v2/cv_trajectory.png
  - results/afm_pipeline/video2_v2/state_summary.png
  conclusions: >
    Correlation matching against corrected-tip pseudo-AFM library successfully captures
    real conformational dynamics in HS-AFM videos. CNN has sim→real domain gap.
    50-rotation approach causes head-tail orientation flipping in overlays.
  connects_to: obj-012
  completed_date: '2026-04-11'
- id: obj-012
  status: completed
  statement: Exhaustive SO(3) rigid-body fitting resolves HS-AFM orientation ambiguity.
  methodology: >
    Wrote fit_rigid_body.py using AFMFold's orientation recovery primitives (2048
    SO(3) rotations/frame via sample_uniform_so3). Custom best-tracking avoids
    summarize_results bug. Post-processing: iterative flip resolution using 180-degree
    rotation candidates to enforce temporal smoothness. Rendered ChimeraX overlays
    using updated render_atomistic_overlay.py with fitted mode.
  metrics:
    video1_frames: 409
    video2_frames: 1296
    rotations_per_frame: 2048
    video1_corr_mean: 0.6905
    video2_corr_mean: 0.7965
    video2_corr_max: 0.9479
    flips_before_smooth_pct: 37.8
    flips_after_smooth_pct: 8.3
    gpu_time_video2_min: 18
  figures:
  - results/afm_pipeline/rigid_body_fitting_summary.png
  - results/afm_pipeline/video2_v3/pdb_atomistic_grid.png
  - results/afm_pipeline/video2_v3/pdb_atomistic_video.gif
  - results/afm_pipeline/video1_v3/pdb_atomistic_grid.png
  - results/afm_pipeline/video1_v3/pdb_atomistic_video.gif
  conclusions: >
    Exhaustive SO(3) search with temporal flip resolution reduces head-tail flipping
    from 38% to 8% of frames. Per-frame correlations are reasonable (0.69-0.80 mean).
    Remaining orientation jumps may require constrained re-fitting or SLERP smoothing.
    The pipeline (fit_rigid_body.py + render_atomistic_overlay.py fitted mode) is
    now end-to-end operational.
  connects_to: null
  completed_date: '2026-04-12'

- id: obj-013
  status: completed
  statement: Head-tracked rigid-body fitting with tip radius comparison
  methodology: >
    Implemented fit_with_head_tracking.py: (1) skip first 30 frames (scan window),
    (2) track integrin head position in AFM via Gaussian smoothing + largest connected
    component centroid, (3) align PDB head domain (αV res 1-440, β3 res 1-350) to
    tracked position instead of COM centering, (4) compare tip radii 1,2,3,5nm on
    subsets of both videos. Used best tip per video for full SO(3) fitting.
  metrics:
    video1_corr_v3: 0.691
    video1_corr_v4: 0.969
    video1_improvement: "+40%"
    video1_best_tip: "3 nm"
    video2_corr_v3: 0.797
    video2_corr_v4: 0.941
    video2_improvement: "+18%"
    video2_best_tip: "2 nm"
    head_drift_mean: "0.13 nm/frame"
    tip_ranking: "2nm ≈ 3nm > 1nm > 5nm"
  figures:
    - results/afm_pipeline/video2_v4/tip_comparison.png
    - results/afm_pipeline/video2_v4/head_tracking.png
    - results/afm_pipeline/video2_v4/pdb_atomistic_video_opt.gif
    - results/afm_pipeline/video1_v4/pdb_atomistic_video_opt.gif
  conclusions: >
    Head-based centering is the dominant improvement — COM centering offset
    the PDB by 2+ nm because legs shift the COM away from the head. Tip radius
    matters less (all between 0.93-0.98) but 2-3nm is optimal. The head position
    is very stable (0.13nm drift/frame), confirming the PI's intuition.
  connects_to: obj-014
  completed_date: '2026-04-12'

- id: obj-014
  status: completed
  statement: Fix head-alignment drift in flip resolution for HS-AFM overlays
  methodology: >
    Diagnosed that resolve_flips() compared each frame to the previous frame,
    causing cumulative head position drift up to 10.4nm (399/1266 frames >1nm
    drift). Wrote resolve_flips_head_anchored() which anchors to tracked AFM
    head positions and re-centers after flip selection. Reprocessed video2_v4
    smooth coordinates and regenerated projection overlay (v5).
  metrics:
    old_drift_mean_nm: 1.01
    old_drift_max_nm: 10.44
    old_frames_above_1nm: 399
    new_drift_mean_nm: 0.00
    new_drift_max_nm: 0.00
    new_frames_above_1nm: 0
    flips_needed: 0
  figures:
    - results/afm_pipeline/video2_v4/head_drift_comparison.png
    - results/afm_pipeline/video2_v4/problem_frames_comparison.png
    - results/afm_pipeline/video2_v4/flip_resolution_diagnostic.png
    - results/afm_pipeline/video2_v5/pdb_projection_video_opt.gif
  conclusions: >
    The old flip resolution was introducing errors on already-correct coordinates.
    Zero flips were actually needed — the SO(3) fitting was consistent. Head
    anchoring eliminates all position drift. The remaining overlay issues are
    conformer library coverage gaps, not alignment errors.
  connects_to: obj-015
  completed_date: '2026-04-13'

- id: obj-015
  status: completed
  statement: Diagnose conformer library coverage gap for extended HS-AFM states
  methodology: >
    Analyzed correlation matching at specific frames (534, 1110) where AFM
    shows extension but overlay shows bent structures. Found the pseudo-AFM
    library uses only 66/264 conformers spanning CV0 53-79A (all compact/early
    intermediate). No conformers above 79A exist. The 1ns CV-distance steering
    trajectory was still extending at cutoff (slope +0.047 A/frame). Need ~2.5x
    more trajectory (~670 frames) to reach full extension (~110A).
  metrics:
    library_conformers: 66
    cv0_range_A: "53-79"
    cv0_max_A: 78.7
    extended_conformers: 0
    steering_slope_at_cutoff: "0.047 A/frame"
    frames_needed_to_110A: 670
    runpod_speed_ns_day: 5.0
  figures:
    - results/afm_pipeline/video2_v4/frame1110_coverage_gap.png
    - results/afm_pipeline/video2_v4/steering_trajectory_analysis.png
  conclusions: >
    The conformer library has zero extended states. The steering trajectory was
    cut short before reaching full extension. Extended MD steering (3ns more)
    launched on RunPod A4500 at 5 ns/day, ETA ~14h.
  connects_to: null
  completed_date: '2026-04-14'

- id: obj-016
  status: completed
  statement: Fix pseudo-AFM library conformer sampling bug + rebuild with full CV coverage
  methodology: >
    Diagnosed that `generate_images(batch_size=16, dataset_size=500)` truncates
    to the first 31 conformers out of 309 — only extended-range frames sampled,
    extended-library conformers completely missing from labels. Switched to
    batch_size=1 so each step processes all 309 conformers with 1 rotation;
    ceil(500/309)=2 steps per epoch ensures every conformer is represented.
    Verified label CV range now spans full library range. Re-ran correlation
    matching + SO(3) fitting on both videos using the corrected library.
  metrics:
    old_label_range_A: "78.6-80.8"
    new_label_range_A: "52.9-85.0"
    library_size: 309
    pseudo_afm_images: 25000
    video1_correlation: 0.966
    video2_correlation: 0.939
    video1_extended_frames: 67
    video2_extended_frames: 179
  figures:
    - results/afm_pipeline/library_bias_analysis.png
    - results/afm_pipeline/video2_v6/pdb_projection_video_opt.gif
  conclusions: >
    Sampling bug was silently invalidating the entire pipeline — only 10% of
    the library's CV range was being used. After fix, SO(3) fitting quality
    improved dramatically and state classification became meaningful. Also
    discovered the library itself is biased (0 conformers below CV0=52.9Å),
    motivating the bent-state steering run.
  connects_to: obj-017
  completed_date: '2026-04-18'

- id: obj-017
  status: completed
  statement: Resolve head-anchored tail flipping in fitted overlays
  methodology: >
    After head-anchored alignment locks the head centroid to the tracked AFM
    head, the remaining DoF is a 180° rotation around the z-axis through head.
    Wrote `resolve_tail_flips.py` that computes tail-vector direction per
    frame and compares to a rolling 21-frame median. Frames whose tail
    direction disagrees with the neighborhood get flipped 180° around the
    head z-axis. Iterates to convergence with 0.05 hysteresis.
  metrics:
    window_frames: 21
    hysteresis: 0.05
    max_iterations: 20
    video1_flips_corrected: 108
    video2_flips_corrected: 229
    video1_flip_pct: 28.5
    video2_flip_pct: 18.1
  figures:
    - results/afm_pipeline/video1_v6/pdb_projection_video_opt.gif
    - results/afm_pipeline/video2_v6/pdb_projection_video_opt.gif
  conclusions: >
    The initial conservative pass (hysteresis 0.2, 5 iters) missed too many
    flips. Stronger settings (wider window, lower hysteresis, more iters)
    cleaned up the residual tail jitter. The integrin overlays now show
    stable tail orientation consistent with temporal smoothness.
  connects_to: obj-018
  completed_date: '2026-04-18'

- id: obj-018
  status: in_progress
  statement: Extend conformer library toward bent state via CV-distance steering
  methodology: >
    Added `cv_distance_bent` preset to domain_steering.py with targets
    [4.0, 3.5, 2.0] nm (α-head↔tail, β-head↔α-tail, α-head↔β-tail) and
    force constant 200. Fixed a separate bug where adding steering forces
    before minimization caused LBFGS hang; now minimize first, then apply
    steering. Running 3ns production on RunPod A4500 at 5.47 ns/day.
    Confirmed bending is occurring: CV0 dropped 78.5→51.4Å in first 148
    frames of production.
  metrics:
    production_time_ps: 3000
    a4500_speed_ns_day: 5.47
    starting_cv0_A: 78.5
    current_cv0_A: 51.4
    target_cv0_A: 40.0
    progress_pct: 79
  figures:
    - figures/checkpoint_2026-04-19.png
  conclusions: >
    Steering is progressing toward target. Next: extract protein frames
    (PBC unwrap required), merge with existing 309 conformers, rebuild
    pseudo-AFM library, and re-fit both videos. Expected BC% to jump
    significantly (~12% → ~40%+) once bent conformers are in the library.
  connects_to: null
  completed_date: null

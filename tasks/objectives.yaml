- id: obj-068
  status: completed
  statement: Per-state domain-pair distances — α-tail↔β-head separates +43 Å BC→EC; α-head↔β-head
    stays together (+3 Å); extension is head-leg separation, not head-head separation
  methodology: >
    Audit §37 v28 P=4 follow-up to obj-067 (per-state shape). obj-067
    showed global shape becomes more rod-like; this pass identifies
    *which* domains separate during the BC → Inter → EC transition.

    Method:
      1. Load 5 canonical αVβ3 domain definitions from
         pipelines/conformer-library/scripts/build_library_metadata.py:
         - alpha_head_thigh (A 1-435), alpha_calf (A 436-741),
           alpha_tail (A 742-956), beta_head (B 1-352),
           beta_tail (B 353-692).
      2. Per frame: compute centroid of each domain's CAs.
      3. 10 pairwise centroid-centroid distances per frame.
      4. Per HMM Viterbi state (obj-048): mean ± std + Δ EC-BC ranking.

    Script: pipelines/avb3-conformers/scripts/domain_pair_distances_per_state.py
  metrics:
    n_frames: 1645
    n_BC: 658
    n_Inter: 587
    n_EC: 400
    n_pairs: 10
    alpha_head_alpha_tail_BC_mean_A: 129.9
    alpha_head_alpha_tail_EC_mean_A: 172.5
    alpha_head_alpha_tail_delta_A: 42.56
    alpha_tail_beta_head_BC_mean_A: 107.8
    alpha_tail_beta_head_EC_mean_A: 151.3
    alpha_tail_beta_head_delta_A: 43.48
    alpha_head_beta_head_BC_mean_A: 35.0
    alpha_head_beta_head_EC_mean_A: 38.3
    alpha_head_beta_head_delta_A: 3.32
    alpha_calf_beta_tail_BC_mean_A: 35.0
    alpha_calf_beta_tail_EC_mean_A: 40.6
    alpha_calf_beta_tail_delta_A: 5.62
    beta_head_beta_tail_BC_mean_A: 56.5
    beta_head_beta_tail_EC_mean_A: 89.1
    beta_head_beta_tail_delta_A: 32.57
    max_separation_pair: alpha_tail-beta_head
    max_separation_delta_A: 43.48
    least_separation_pair: alpha_head_thigh-beta_head
    least_separation_delta_A: 3.32
  figures:
    - figures/domain_pair_distances_per_state_v1.png
    - results/afm_pipeline/domain_pair_distances/domain_pair_distances.png
  conclusions: >
    **The integrin extension is empirically head-leg separation, not
    head-head or leg-leg separation**:

    Top-2 most-separating pairs (Δ EC-BC ≥ 40 Å):
    - **α-tail ↔ β-head**: +43.48 Å (107.8 → 151.3) — αV foot/genu
      pulls away from β3 βA-domain.
    - **α-head_thigh ↔ α-tail**: +42.56 Å (129.9 → 172.5) —
      αV head pulls away from αV foot (within-chain extension).

    Pairs that stay tightly together (Δ EC-BC ≤ 10 Å):
    - **α-head ↔ β-head**: only **+3.32 Å** (35.0 → 38.3) — the
      headpiece stays as a unit during extension. This empirically
      confirms the Springer model's defining feature: extension
      separates head from leg, not head from head.
    - **α-calf ↔ β-tail**: +5.62 Å — the legs stay close.
    - **α-tail ↔ β-tail**: +9.53 Å — the feet stay close.
    - **α-calf ↔ α-tail**: +13.14 Å — within αV chain, modest
      extension (the αV C-terminal hinge between calf-1/2 and
      genu/foot is not the dominant pivot).

    Mid-tier (Δ 10-35 Å):
    - **α-head ↔ β-tail**: +32.91 Å (αV head to β3 PSI/EGF/tail)
    - **β-head ↔ β-tail**: +32.57 Å (β3 chain extension, hybrid
      domain swing-out)
    - **α-head ↔ α-calf**: +21.54 Å (αV propeller to αV calf-1)
    - **α-calf ↔ β-head**: +18.52 Å

    **BC σ wider than EC σ across all pairs**: e.g., α-tail↔β-head
    BC σ = 19.1 Å vs EC σ = 7.1 Å (2.7× wider). Triangulates with
    obj-067 (shape variance 2.4-3× wider in BC) and obj-051 (BC
    sub-state heterogeneity).

    **Reviewer panel reinforced**:
    - **Reviewer A** (Springer/Campbell): the BC → EC transition
      empirically confirms the canonical head-leg separation model.
      α-head ↔ β-head stays at +3 Å while α-tail ↔ β-head goes to
      +43 Å. This is the integrin's defining structural change
      rendered quantitatively from HS-AFM.
    - **Reviewer B** (Jumper/Ahdritz): per-domain centroids give
      a coarse-grained reaction coordinate alternative to CV0
      (head-tail Cα distance) — should be a simpler ML target
      than per-residue coords.
    - **Reviewer D** (Elber/Chipot): identifies α-tail ↔ β-head
      as the natural reaction coordinate for committor analysis.
      The two largest-Δ pairs both involve α-tail, suggesting the
      α C-terminal foot is the kinetic gateway (consistent with

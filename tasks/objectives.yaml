  statement: 3-D HMM over (CV0, CV1, CV2) — same partition as obj-055, CV1 confirmed redundant, no EO support
  methodology: >
    Audit §28 v19 P=5 follow-up to obj-055. Methodological completism:
    fit a full 3-D Gaussian-emission HMM over (CV0, CV1, CV2) to test
    whether adding CV1 reveals a partition different from obj-048 (1-D)
    or obj-055 (2-D). obj-054 already established CV1 highly correlated
    with CV0 (r = 0.84 V1 / 0.87 V2) — expectation is "no, same partition".

    Implementation: from-scratch (no `hmmlearn`):
      - 3-D Gaussian emissions per state (mean ∈ ℝ³, full 3×3 covariance)
      - Forward-backward in log-space
      - Baum-Welch EM with 3×3 covariance updates + 1e-3·I regularization
      - Viterbi decoding

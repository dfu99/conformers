- id: obj-043
  status: completed
  statement: Boltzmann state populations + V1/V2 ΔG reproducibility from unbiased fitted trajectories
  methodology: >
    Audit §13 deepening pass v5. Pure-derivative analysis on the existing
    cv_series.npz cache (1645 frames from V1 + V2 fitted trajectories).
    Three computations:

      1. Boltzmann population fractions in BC, Intermediate, EC, EO bands

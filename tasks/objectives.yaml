    BC | leaving) = 0.597; P(Intermediate → EC | leaving) = 0.403. The
    surface-bound ensemble is biased toward BC by ~60 % when leaving
    the Intermediate. Reviewer D's true committor still requires
    saddle-seeded unbiased MD; this is the experimental analog,
    available now.


    Inter 35.2 %, EC 24.4 % — different from obj-043's hard-threshold
    25 / 46 / 24 / 5 %. Both are internally consistent under their
    respective definitions; the HMM's BC state has σ = 8.8 Å so it
    absorbs frames in the 50-70 Å transition zone. The HMM is the
    right framework when BC↔EC kinetic accessibility is the
    quantity of interest; the hard-threshold partition is right when
    "fraction of time in the geometric BC band" is the question.

- id: obj-040
  status: completed
  statement: F4 Hertzian contact-mechanics control closes Reviewer C blocker
  methodology: >
    Implemented `pipelines/sim-afm-video/scripts/contact_mechanics_control.py`.
    Compared the hard-sphere geometric paraboloid dilation (currently
    used in `simulate_afm_video.py`) against a Hertzian contact-mechanics
    model on a 2 nm probe sphere imaged with a 1.5 nm Si tip across
    HS-AFM-typical imaging forces (50, 100, 200 pN). Material constants
    from Müller/Ando HS-AFM literature: E_protein = 1 GPa, E_tip = 130 GPa
    (Si), ν = 0.3 both. Computed effective radius R_eff = 0.857 nm and
    effective modulus E* = 1.09 GPa. For each force computed Hertz
    indentation δ = (9F²/(16 E*² R_eff))^(1/3), contact radius a, and
    peak contact pressure p_max. Rendered side-by-side height maps,
    cross-section overlay, and δ-vs-F curve.
  metrics:
    R_eff_nm: 0.857
    E_star_GPa: 1.09
    force_50_pN_indent_nm: 0.111
    force_100_pN_indent_nm: 0.177
    force_200_pN_indent_nm: 0.281
    force_50_pN_contact_radius_nm: 0.309
    force_100_pN_contact_radius_nm: 0.389
    force_200_pN_contact_radius_nm: 0.490
    force_50_pN_p_max_MPa: 250
    force_100_pN_p_max_MPa: 315
    force_200_pN_p_max_MPa: 397
    HS_AFM_noise_floor_nm: 1.0
    max_height_loss_pct_at_200pN: 14
  figures:
    - figures/contact_mechanics_control.png
    - results/afm_pipeline/contact_mechanics/contact_mechanics_control.png
  conclusions: >
    Hertzian indentation across the HS-AFM imaging-force range
    (50-200 pN) ranges 0.11-0.28 nm — 5-14 % of the 2 nm probe-sphere
    height. All values sit BELOW the 1 nm vertical noise floor
    (Ando 2013 review). Hard-sphere pseudo-AFM is therefore a
    defensible first-order model for the v7 fitting pipeline:
    Hertzian correction is a known, quantifiable systematic in
    the noise-bounded regime, not a confounder for fit conclusions.
    Reviewer-C contact-mechanics #4 audit blocker closes. Optional
    follow-up: an `--hertz-force` flag on `simulate_afm_video.py`
    for downstream correction; document offset in figure captions.
  connects_to: null
  completed_date: '2026-05-05'

- id: obj-039
  status: completed
  statement: RGD-binding-pocket accessibility — bent vs extended αVβ3 v7 conformers
  methodology: >
    Reviewer-E proof-of-concept (audit-2026-05-05 §8 F4). Real Vina/smina
    docking on αVβ3 was blocked on Mn²⁺ MIDAS parameterization + rdkit/
    meeko/gemmi dependencies that conflict with the project's strict
    venv split (CLAUDE.md §4 protenix vs boltz vs gemmi). Implemented
    a defensible geometric proxy instead: for each of the 5 most-bent
    (CV0=47.3-47.6 Å) and 5 most-extended (CV0=84.9-85.0 Å) library
    conformers, computed (a) Shrake-Rupley SASA on the 10 canonical
    MIDAS-pocket residues (αV D218 β-propeller; β3 D119, S121, S123,
    Y122, R214, N215, R216, E220, D251 βA-domain RGD-binding shell);
    (b) steric occlusion = heavy-atom count in a 12 Å sphere around
    the MIDAS centroid (normalized by the bent reference); (c) the
    MIDAS-centroid ↔ leg-centroid distance as the steric-blocker
    metric. Script `pipelines/conformer-library/scripts/rgd_pocket_accessibility.py`.
  metrics:
    n_bent: 5
    n_extended: 5
    bent_cv0_mean_A: 47.50
    extended_cv0_mean_A: 84.97
    bent_midas_sasa_mean_A2: 459.4
    extended_midas_sasa_mean_A2: 298.1
    delta_sasa_pct: -35.1
    bent_pocket_occlusion: 3.78
    extended_pocket_occlusion: 4.19
    bent_midas_leg_distance_A: 60.3
    extended_midas_leg_distance_A: 112.0
    delta_midas_leg_distance_A: 51.7
  figures:
    - figures/rgd_docking_v1.png
    - results/afm_pipeline/rgd_docking/rgd_pocket_accessibility.png
  conclusions: >
    Negative result with high diagnostic value. The legs do retreat
    52 Å from the MIDAS centroid in the extended frames — the
    head-leg steering worked geometrically. But MIDAS-pocket SASA
    DROPS 35 % on extension (459 → 298 Å²), and the 12 Å steric
    sphere becomes more occluded (3.78 → 4.19 normalized atoms).
    The interpretation is that v7's "extended" frames are EC
    (extended-closed): the αV β-propeller and β3 βA-domain rotate
    relative to each other during steering and incidentally bury
    the MIDAS pocket; the EC→EO headpiece-opening transition
    that exposes the high-affinity site never occurred (consistent
    with obj-025 — k=1000 SMD only opens CV2 by 0.9 Å in 3 ns).
    Real Vina/smina docking on these frames would therefore
    rediscover the EO-coverage gap, not the bent-vs-extended
    affinity contrast reviewer E imagines. RGD-affinity comparison
    is gated on EO frames; this PoC sharpens the audit blocker
    rather than dissolving it.
  connects_to: null
  completed_date: '2026-05-05'

- id: obj-029
  status: completed
  statement: First-principles bent-state geometry predicts αIIbβ3 more bent than αVβ3
  methodology: >
    Downloaded 7 integrin heterodimer PDBs from RCSB (1JV2, 3FCS,
    3VI4, 4UM9, 5FFG, 6OM2, 6UJC). Wrote
    `multi_integrin_first_principles.py` to extract bent-state
    structural features without consulting kinetics literature: (1)
    head-leg buried SASA via shrake-rupley; (2) head-tail centroid
    distance; (3) long-axis extent + Rg. Pre-registered prediction
    rule: more head-leg buried SASA + smaller head-tail = more bent
    in solution. Then post-hoc compared to the Li 2024 + platelet
    activation hierarchy.
  metrics:
    avb3_1jv2_head_leg_buried_sasa_A2: 13442
    avb3_1jv2_head_tail_distance_A: 42.6
    aiibb3_3fcs_head_leg_buried_sasa_A2: 15298
    aiibb3_3fcs_head_tail_distance_A: 37.2
    aiibb3_vs_avb3_buried_sasa_relative_increase: 0.138
    aiibb3_vs_avb3_head_tail_relative_decrease: 0.127
    headpiece_only_structures_count: 5
  figures:
    - results/multi_integrin/bent_state_features.png
  conclusions: >
    αIIbβ3 (3FCS) is predicted *more bent* than αVβ3 (1JV2) by both
    metrics (14% more head-leg buried SASA, 13% smaller head-tail
    distance). Post-hoc literature agrees: αIIbβ3 has the lowest
    spontaneous activation rate of any integrin (Li 2024), while
    αVβ3 is bistable in solution (Chen 2023). Pre-registered
    first-principles prediction validates against published
    activation hierarchy. αIIbβ3 is the right second integrin to
    validate the AFMFold pipeline against; its full ectodomain
    bent crystal also makes it the cleanest target for steering MD.

- id: obj-056
  status: completed
  statement: Cryptic-pocket scan v7 αVβ3 library — 1 druggable candidate at β3 hybrid/EGF1 hinge (Reviewer E)
  methodology: >
    Audit §13.5 + §24.6 P=3 follow-up. Reviewer E's open concern was
    "any cryptic site that opens > 100 Å² between BC and EC?" The earlier
    queue entry was auto-marked completed via obj-046 fallout but no
    actual analysis existed on disk. This pass delivers the genuine scan.

    From-scratch implementation (no P2Rank/FTMap/fpocket dependency):
      1. Reused obj-039 CV0 cache to pick 20 most-bent (CV0 ≤ 47.83 Å)
         + 20 most-extended (CV0 ≥ 84.66 Å) library frames.
      2. Per-frame Shrake-Rupley residue-level SASA (1654 residues × 40
         frames). 96.8 s on the local box; cached to sasa_cache.npz.
      3. Per-residue ΔSASA = mean_ext − mean_bent, Welch-t with pooled SE.
         Flagged opening (Δ > +20 Å²) and closing (Δ < −20 Å²) residues.
      4. Single-linkage spatial clustering (Cα ≤ 7 Å) of opening residues
         with recursive split for clusters > 25 residues (down to 4 Å
         floor); separated discrete pockets from "megaclusters" that
         represent bulk head-leg interface gain during BC→EC extension.
      5. Druggability filter on each pocket: intra-domain (all member
         residues within one canonical domain), hydrophobic-residue
         fraction ≥ 40 %, ≥ 5 residues. Domains: αV propeller-thigh
         (1-435), αV calf (436-741), αV tail (742-956), β3 PSI-hybrid-βA
         (1-352), β3 EGF-βtail (353-692).
      6. Sensitivity bound from per-residue pooled SE: minimum-detectable
         single-residue ΔSASA at α=0.05 = 1.96·median(SE).

    Script: pipelines/conformer-library/scripts/cryptic_pocket_scan.py

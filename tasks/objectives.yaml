  conclusions: >
    The mechanical-sensitivity ranking from obj-027 is
    quantitatively defended. Per-video means agree to 4 significant
    figures (V1=19.29, V2=19.30 Å) — a coincidence rate the v7
    pipeline cannot have engineered, since V1 and V2 are independent
    HS-AFM streams analyzed by the same pipeline. The per-residue
    Pearson r=0.998 between V1 and V2 RMSF profiles is a strong
    cross-video reproducibility signal.

    The top-19 most-flexible residues are rock-solid (hold rate
    ≥ 0.97 across 500 bootstrap resamples). The 20-th vs 21-st
    boundary is fuzzy: the 20-th's lower CI bound (87.12 Å) sits
    below the 21-st's upper CI bound (90.84 Å), so the exact set
    of "top-20" residues is finite-sample sensitive. Recommend
    reporting the top-19 as the publication-grade flexibility
    ranking; treat residues 20-25 as a "second-tier" group.

    All top residues sit in αV chain A C-terminal regions (calf-2
    + membrane-proximal: 761-764, 804-805, 909-915, 956-962),
    consistent with the obj-027 + obj-028 mechanical-sensitivity
    composite. The β3 chain shows lower per-residue RMSF in absolute
    terms but the CI is uniformly narrow, supporting the prior
    conclusion that the bent-extended dynamics are dominantly
    α-subunit-driven.

    The combined-set RMSF (46.55 Å) is much higher than per-video
    (19.3 Å) because it picks up the inter-video systematic offset
    in mean position. The bootstrap on the combined set therefore
    measures the *combined* finite-sample noise floor, which is
    appropriate for the noise-bound argument in the audit.

    The 1-D HMM correctly carries "BC has closed headpiece"
    information but cannot resolve Inter↔EC headpiece-opening.
    This is consistent with v7 data simply not containing
    further-opened-EO frames (cf. obj-055 2-D HMM with seeded
    CV2 = 55 collapsing back to 41.6, obj-059 3-D HMM with same
    behavior). Both Inter and EC stop near CV2 ≈ 38 Å, well
    below the 50 Å EO threshold.

    **Triangulation across CV2-orthogonality methods**: four
    independent objectives now confirm the orthogonal-CV2 finding:
    - obj-054: per-CV correlation r ≤ 0.52 V1, ≤ 0.22 V2
    - obj-055: 2-D HMM clusters primarily by CV2
    - obj-059: 3-D HMM finds CV1 redundant with CV0, CV2 carries info
    - obj-064: 1-D HMM × CV2 explains only 5 % of variance


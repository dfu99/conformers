    druggable_pocket_domain: "β3 EGF-βtail (residue 417-422 hybrid/EGF1 hinge)"
    druggable_pocket_hydrophobic_fraction: 0.40
    druggable_pocket_aggregate_dsasa_A2: 237.0
    druggable_pocket_top_residue: "B:GLY420 ΔSASA=+77.7 Å²"
    welch_t_significant_at_alpha_0p05: 1149
    welch_t_expected_by_chance: 83
    enrichment_over_chance: 13.8
    sensitivity_min_single_residue_dsasa_A2: 3.43
    sensitivity_min_5res_pocket_dsasa_A2: 7.68
  figures:
    - figures/cryptic_pockets_v1.png
    - results/cryptic_pockets/pocket_summary.json
    - results/cryptic_pockets/cryptic_pockets_v1.png
  conclusions: >
    **Reviewer E partially addressed**. 18 candidate opening pockets
    found over BC→EC; after filtering to intra-domain (rules out trivial
    rigid-body head-leg separation as the cause) we keep 9. After the
    druggability filter (≥ 40 % hydrophobic, ≥ 5 residues): **exactly 1
    candidate** — β3 K417-V419-G420-F421-K422, a 5-residue cluster at
    the β3 βA / hybrid / EGF1 hinge with aggregate ΔSASA = +237 Å² and
    one aromatic (PHE421). This region is biologically reasonable: the
    β3 hybrid-domain swing-out is a documented allosteric site in
    integrin activation (Springer 2003, 2014). Finding it via a pure
    geometric SASA-differential scan independently corroborates the
    literature.

    **The MIDAS RGD-binding pocket is NOT in the cryptic list** — it
    appears in the closing pockets (obj-039 already showed MIDAS SASA
    drops 35 % on extension). The "obvious" answer to "does extension
    expose new ligand-binding sites?" remains: not the canonical RGD
    site, but possibly the β3 hybrid hinge.

    **Sensitivity bound**: the design resolves single-residue ΔSASA ≥
    3.4 Å² and 5-residue aggregate ΔSASA ≥ 7.7 Å² at α=0.05 — well
    below the 100 Å² aggregate threshold from the success criterion,
    so any cryptic site that opens > 100 Å² over BC→EC would be
    detected. Welch-t shows 1149 sig residues vs 83 expected by chance
    (13.8× enrichment), confirming statistical power.

    **Caveats**:
      (a) The β3 K417-K422 candidate is at the same general region as
      the β3 βA / hybrid / EGF1 hinge that physically opens during the
      hybrid swingout — so even though it's "intra-domain" by my coarse
      classification (β3 EGF-βtail = 353-692), the opening may still
      reflect the βA/hybrid/EGF1 multi-subdomain rearrangement rather
      than a true local cryptic gating event. A finer subdomain split
      could re-classify it as inter-subdomain.
      (b) This is a *static* differential SASA scan, not a true pocket-
      detection algorithm. P2Rank or FTMap on the same frames would
      score the candidate's binding-pocket likelihood directly. Logged
      as a follow-up if compute permits.
      (c) Reviewer E might still ask for blind ligand-docking on the
      β3 K417-K422 region; that's a downstream P=4 task gated on PI
      sign-off + compute allocation.

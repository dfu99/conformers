      2. Load HMM Viterbi labels from hmm_states.npz.
      3. Per state s ∈ {BC, Inter, EC}: histogram + mean/std/median/IQR
         for each CV.
      4. Pairwise KS test on per-CV distributions across BC/Inter/EC.
      5. R² = between-state-variance / total variance per CV.
      6. Bonferroni correction across 3 pairwise tests per CV.

    Script: pipelines/afm-overlay/scripts/per_state_cv2_distribution.py
  metrics:
    n_frames: 1645
    n_BC: 658
    n_Inter: 587
    n_EC: 400
    cv0_r2_state: 0.681
    cv1_r2_state: 0.658
    cv2_r2_state: 0.053
    cv2_BC_mean_A: 34.96
    cv2_BC_std_A: 6.98
    cv2_Inter_mean_A: 37.63
    cv2_Inter_std_A: 5.88
    cv2_EC_mean_A: 38.28
    cv2_EC_std_A: 5.16
    cv2_BC_vs_Inter_ks_D: 0.295
    cv2_BC_vs_Inter_p: 2.71e-24
    cv2_Inter_vs_EC_ks_D: 0.070
    cv2_Inter_vs_EC_p: 0.18
    cv2_BC_vs_EC_ks_D: 0.276
    cv2_BC_vs_EC_p: 3.65e-17
    cv2_n_sig_pairs_bonf: 2
    bonferroni_alpha: 0.0056
  figures:
    - figures/per_state_cv2_distribution.png
    - results/afm_pipeline/free_energy_profile/per_state_cv2_distribution.json
  conclusions: >
    **The 1-D-CV0 HMM carries CV2 information but very partially**.
    R² state explains: CV0 0.681 (definitional, since the HMM is
    fit on CV0); CV1 0.658 (CV1 ≈ CV0 + noise — confirms obj-054
    r ≥ 0.84 between CV0 and CV1, and obj-059 within-state CV1
    correlation +0.69 to +0.82); CV2 only 0.053 (5 % of variance).

    **BC is CV2-distinguishable, Inter ≈ EC by CV2**:
    - BC mean CV2 = 34.96 ± 6.98 Å (lowest, headpiece closed)
    - Inter mean CV2 = 37.63 ± 5.88 Å
    - EC mean CV2 = 38.28 ± 5.16 Å
    - Pairwise KS: BC↔Inter D = 0.295 p = 2.7e-24 (Bonferroni-sig);
